name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest tests/ -q --cov=music_fetch --cov-report=term --cov-report=xml

      - name: Run tests from a non-root working directory
        # Guards against tests that read repo files through cwd-relative paths.
        working-directory: /tmp
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - name: Run strict type checks
        run: python -m mypy music_fetch/ --strict

      - name: Run lint checks
        run: python -m ruff check .
