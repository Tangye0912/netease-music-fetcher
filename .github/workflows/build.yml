name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest tests/ -q --cov=music_fetch --cov-report=term --cov-report=xml

      - name: Run strict type checks
        run: python -m mypy music_fetch/ --strict

      - name: Run lint checks
        run: python -m ruff check music_fetch/ tests/

      - name: Build executable
        run: python build.py --clean

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "name=music-fetch-windows" >> $GITHUB_OUTPUT
            echo "file=dist/music-fetch.exe" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Give every platform a distinct *file name*: the release upload
            # uses the file's own name, so macOS and Linux both publishing
            # "music-fetch" made them overwrite each other and silently shipped
            # a Linux binary to macOS users.
            cp dist/music-fetch dist/music-fetch-macos
            echo "name=music-fetch-macos" >> $GITHUB_OUTPUT
            echo "file=dist/music-fetch-macos" >> $GITHUB_OUTPUT
          else
            cp dist/music-fetch dist/music-fetch-linux
            echo "name=music-fetch-linux" >> $GITHUB_OUTPUT
            echo "file=dist/music-fetch-linux" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.file }}
          retention-days: 3

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.artifact.outputs.file }}
          draft: true
          generate_release_notes: true
