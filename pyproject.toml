[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music-fetch"
version = "0.12.0"
description = "\u7f51\u6613\u4e91\u97f3\u4e50\u5355\u66f2\u4e0b\u8f7d\u5de5\u5177"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
webengine = ["PySide6-Addons>=6.5"]

[project.scripts]
music-fetch = "_cli:main"

[project.urls]
Homepage = "https://github.com/Tangye0912/netease-music-fetcher"

[tool.setuptools]
py-modules = [
    "_api",
    "_audio",
    "_batch_dialogs",
    "_batch_models",
    "_batch_results",
    "_cli",
    "_combo_utils",
    "_dialog_batch_settings",
    "_dialog_login",
    "_dialog_manager",
    "_dialog_progress",
    "_dialogs",
    "_gui_styles",
    "_version_check",
    "_workers",
    "app_logging",
    "app_settings",
    "app_stores",
    "batch_inputs",
    "download_retry",
    "download_tasks",
    "error_texts",
    "main",
    "music_fetch",
    "ui_texts",
]
