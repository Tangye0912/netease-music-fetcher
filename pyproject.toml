[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music-fetch"
version = "1.0.12"
description = "网易云音乐单曲下载工具"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5,<7.0",
    "mutagen>=1.45",
]

[project.optional-dependencies]
webengine = ["PySide6-Addons>=6.5"]

[project.scripts]
music-fetch = "music_fetch.cli:main"

[project.urls]
Homepage = "https://github.com/Tangye0912/netease-music-fetcher"

[tool.setuptools]
packages = ["music_fetch"]