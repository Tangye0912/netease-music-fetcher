[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music-fetch"
version = "3.4.0"
description = "网易云音乐单曲下载工具（终端 TUI + CLI）"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.45",
    "prompt-toolkit>=3.0,<4.0",
    "pycryptodome>=3.20",
    "requests[socks]>=2.31,<3.0",
    "websocket-client>=1.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.6"]

[project.scripts]
music-fetch = "music_fetch.app:main"

[project.urls]
Homepage = "https://github.com/Tangye0912/netease-music-fetcher"

[tool.setuptools]
packages = ["music_fetch"]

[tool.mypy]
# Qt-era PySide6 stubs are gone, but keep these defensive disables so strict
# mode stays green across third-party stubs.
disable_error_code = ["override", "attr-defined", "call-overload", "no-any-return", "no-untyped-call", "no-untyped-def", "truthy-function", "import-untyped"]
# Use the strictest settings we can without breaking on third-party stubs:
strict = true
# These modules have incomplete stubs — don't check them:
[[tool.mypy.overrides]]
module = [
    "mutagen.*",
]
ignore_errors = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Minimal guardrail set: pyflakes errors/warnings + import issues.
select = ["E", "F", "W"]
# Single-line log/URL strings are a deliberate project style (grep-friendly);
# reflowing them adds churn without value, so line length stays unchecked.
ignore = ["E501"]

[tool.coverage.report]
# Floor set at the measured 75% baseline (2026-09); raise as coverage grows.
fail_under = 75
show_missing = true
